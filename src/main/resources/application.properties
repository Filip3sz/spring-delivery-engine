spring.application.name=delivery-delivery-engine
server.port=8080
# Prettier JSON
spring.jackson.serialization.indent-output=true
# 2. Konfiguracja bazy danych PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/delivery_db
spring.datasource.username=postgres
spring.datasource.password=password
spring.datasource.driver-class-name=org.postgresql.Driver
# Automatyczne tworzenie/aktualizacja tabel w bazie na podstawie encji w Javie
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
# 3. Konfiguracja bazy Redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
# 4. Konfiguracja Apache Kafka
spring.kafka.bootstrap-servers=localhost:9092
# Konfiguracja Kafki (odbierane wiadomości)
spring.kafka.consumer.group-id=delivery-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
# Konfiguracja Kafki (wysyłanie wiadomości)
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
